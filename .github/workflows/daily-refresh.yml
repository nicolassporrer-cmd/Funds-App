name: Daily refresh

# Re-runs the whole pipeline and commits the derived JSON.
#
# SEC_USER_AGENT is REQUIRED for the New York half. www.sec.gov answers 403 to
# any request without a declared "AppName contact@email" user agent, on the very
# first call, and its message claims a rate-limit that is not the real cause.
# The job fails loudly if it is absent rather than committing a France-only
# dataset that would look like every US company had stopped raising.
#
# The French sources (fund websites, recherche-entreprises.api.gouv.fr, BODACC
# via DILA) need no key.
on:
  schedule:
    - cron: '40 6 * * *'      # 06:40 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require the SEC user agent
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT is not set. Add it under Settings > Secrets and variables > Actions."
            echo "Expected form: Funds-App you@example.com"
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*) echo "SEC user agent is set." ;;
            *) echo "::error::SEC_USER_AGENT has no email address in it; SEC will return 403."; exit 1 ;;
          esac

      # Fund sites get redesigned without warning. This step does not fail when
      # one adapter breaks — the other nine still refresh — but it prints the
      # failures, and the summary below surfaces them in the run.
      - name: Read fund portfolio pages
        run: node scripts/fetch-portfolios.cjs

      # One request per company on the seven funds that publish nothing on their
      # index page. Cached on disk, so a company already enriched is not fetched
      # again and a normal day only touches new portfolio entries.
      - name: Fetch company pages for descriptions and deal leads
        run: node scripts/enrich-companies.cjs

      # Cached: a name already resolved to a SIREN is never re-queried, so this
      # only spends API calls on companies that are new since yesterday.
      - name: Resolve new company names to SIRENs (Paris funds)
        run: node scripts/resolve-sirens.cjs

      - name: Fetch register announcements from BODACC
        run: node scripts/fetch-events.cjs

      - name: Classify capital events
        run: node scripts/classify-rounds.cjs

      # Every capital change filed in Ile-de-France, filtered to venture-shaped
      # companies. Months already exported and companies already looked up are
      # cached, so a normal day fetches two months and a handful of new companies.
      - name: Sweep the Ile-de-France register for venture rounds
        run: node scripts/fetch-paris-market.cjs

      # Every New York venture round, plus US rounds by any tracked fund's portfolio
      # company. Historical quarters are kept in data/us-deals.json and never
      # re-downloaded; only the latest two quarters are refreshed each day.
      - name: Fetch US venture rounds from SEC bulk Form D data
        run: node scripts/fetch-formd-bulk.cjs

      - name: Score which companies look like they are about to raise
        run: node scripts/score-prospects.cjs

      - name: Assemble the deal log across both registers
        run: node scripts/build-deals.cjs

      - name: Assemble the page payload
        run: node scripts/build-payload.cjs

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ && git diff --quiet --cached -- data/; then
            echo "Nothing changed today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          SUMMARY=$(node -e "
            const p = require('./data/payload.json');
            console.log(p.totals.companies + ' companies, ' + p.totals.strongSignal + ' strong raise signal, '
              + p.totals.withBridge + ' on a bridge');
          ")
          git add data/
          git commit -m "Daily refresh: $SUMMARY"
          git push

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the refresh
  # must publish its own commit. Without this the data updates in the repo and the
  # live site silently never changes.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
